name: Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check for Changesets
        id: changesets
        run: |
          if [ -n "$(git ls-files .changeset/*.md)" ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version Packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npm run changeset:version

      - name: Get Version
        if: steps.changesets.outputs.has_changesets == 'true'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Tag
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "Antunsvetic"
          git config user.email "antun.svetic@gmail.com"
          git add .
          git commit -m "chore: version packages to v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin develop
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish to NPM
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
